<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Advice generator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="style.css" />
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="advice-card">
        <h1>ADVICE #<span id="adv-id">117</span></h1>
        <p id="advice">
          "It is easy to sit up and take notice, what's difficult is getting up
          and taking action. "
        </p>
        <picture>
          <source
            media="(max-width: 580px )"
            srcset="./images/pattern-divider-mobile.svg"
            sizes=""
          />
          <img src="./images/pattern-divider-desktop.svg" alt="divider" />
        </picture>
        <!-- <div class="line"><span>"</span></div> -->
        <button id="generate-btn" aria-label="Get advice" tabindex="1">
          <img src="./images/icon-dice.svg" alt="This is a dice icon" />
        </button>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/ezzsnowdev">Ahmed Ezz</a>.
    </footer>

    <script src="./main.js"></script>
  </body>
</html>
